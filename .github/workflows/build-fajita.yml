name: Build OnePlus 6T (fajita) Images

on:
  workflow_dispatch:
    inputs:
      ostree_remote_url:
        description: 'URL Remote OSTree Luma'
        required: true
        default: 'https://dl.simplyluma.com/os/repo'
      firmware_oneplus_repo:
        description: 'Repo Git Firmware OnePlus SDM845'
        required: true
        default: 'https://gitlab.com/sdm845-mainline/firmware-oneplus-sdm845'
      linux_firmware_repo:
        description: 'Repo Git Linux Firmware'
        required: true
        default: 'https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git'
      pmaports_repo:
        description: 'Repo Git PostmarketOS pmaports (initramfs)'
        required: true
        default: 'https://gitlab.nura.eco/nura/pmaports'
      ostree_commit:
        description: 'Spesifik commit OSTree (opsional, kosong = ref nightly terbaru)'
        required: false
        default: ''

jobs:
  build-fajita:
    name: Build Fajita Kernel & Images
    runs-on: ubuntu-24.04-arm
    # Jika runner ARM tidak tersedia pada plan repo, gunakan: runs-on: ubuntu-latest (dengan cross-compiler)

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune -a -f || true
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential clang lld llvm bc bison flex libelf-dev libssl-dev \
            python3 python3-jsonschema git zstd cpio \
            ostree mkbootimg android-sdk-libsparse-utils dosfstools e2fsprogs fdisk

      - name: Run Fajita Image Builder Script
        env:
          OSTREE_REMOTE_URL: ${{ github.event.inputs.ostree_remote_url }}
          FIRMWARE_OP_REPO: ${{ github.event.inputs.firmware_oneplus_repo }}
          LINUX_FW_REPO: ${{ github.event.inputs.linux_firmware_repo }}
          PMAPORTS_REPO: ${{ github.event.inputs.pmaports_repo }}
          COMMIT: ${{ github.event.inputs.ostree_commit }}
        run: |
          sudo -E bash scripts/devices/build-fajita-images.sh

      - name: Upload Built Images & Checksums
        uses: actions/upload-artifact@v4
        with:
          name: luma-oneplus-fajita-images
          path: |
            build/fajita/images/luma-fajita-boot.img
            build/fajita/images/luma-fajita-boot.img.sha256
            build/fajita/images/luma-fajita-userdata.sparse
            build/fajita/images/luma-fajita-userdata.sparse.sha256
          retention-days: 7

